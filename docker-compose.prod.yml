services:
  web:
    build: .
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "1"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media:/app/media
    # Exposto apenas no loopback; o Nginx no host faz o proxy reverso/TLS.
    ports:
      - "127.0.0.1:8006:8006"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8006/health/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  media:
