services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: hdto-dev
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      UV_PROJECT_ENVIRONMENT: /app/.venv
    command: sh -c "uv sync --frozen && uv run python manage.py migrate && uv run python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8006:8000"
