[project]
name = "hdto"
version = "0.1.0"
description = "Plataforma Integrada dos Homens Batistas do Tocantins"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "psycopg[binary]>=3.2",
    "django-environ>=0.12",
    "whitenoise>=6.9",
    "pillow>=11.0",
    "qrcode>=8.0",
    "argon2-cffi>=23.1",
    "cryptography>=44.0",
    "django-filter>=25.1",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "ruff>=0.9",
    "django-debug-toolbar>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
addopts = "-q --cov=apps --cov-report=term-missing"
testpaths = ["tests"]
