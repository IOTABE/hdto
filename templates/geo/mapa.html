{% extends "base.html" %}
{% block title %}Mapa — HDTO{% endblock %}
{% block extra_head %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
{% endblock %}
{% block content %}
  <h1>Mapa das congregações</h1>
  <form id="filtros" class="filtros">
    <label>Tipo
      <select name="tipo">
        <option value="">Todos</option>
        {% for tipo in tipos %}<option value="{{ tipo.valor }}">{{ tipo.rotulo }}</option>{% endfor %}
      </select>
    </label>
    <button type="submit">Filtrar</button>
  </form>
  <div id="mapa" class="mapa" aria-label="Mapa das igrejas"></div>
  <p id="mapa-status" role="status"></p>
{% endblock %}
{% block extra_scripts %}
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" defer></script>
  <script src="/static/js/mapa.js" defer></script>
{% endblock %}
