{% extends "base.html" %}
{% block title %}{{ titulo }} — HB-TO{% endblock %}
{% block content %}
  <header class="page-head">
    <div>
      <p class="eyebrow">Gestão de conteúdo</p>
      <h1>{{ titulo }}</h1>
      {% if subtitulo %}<p class="subtitle">{{ subtitulo }}</p>{% endif %}
    </div>
  </header>

  <div class="glass-card form-card">
    <form method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <div class="form-actions">
        <a class="btn btn--text" href="{{ cancel_url }}">Cancelar</a>
        <button class="btn btn--filled" type="submit">{{ submit_label|default:"Salvar" }}</button>
      </div>
    </form>
  </div>
{% endblock %}
