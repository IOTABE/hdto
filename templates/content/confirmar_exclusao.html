{% extends "base.html" %}
{% block title %}{{ titulo }} — HB-TO{% endblock %}
{% block content %}
  <header class="page-head">
    <div>
      <p class="eyebrow">Gestão de conteúdo</p>
      <h1>{{ titulo }}</h1>
    </div>
  </header>

  <div class="glass-card form-card">
    <div class="form-alert" role="alert">
      <p>{{ descricao }}</p>
    </div>
    <p class="helper">Esta ação não pode ser desfeita.</p>
    <form method="post">
      {% csrf_token %}
      <div class="form-actions">
        <a class="btn btn--text" href="{{ cancel_url }}">Cancelar</a>
        <button class="btn btn--danger" type="submit">Excluir</button>
      </div>
    </form>
  </div>
{% endblock %}
