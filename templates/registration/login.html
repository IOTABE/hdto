{% extends "base.html" %}
{% block title %}Entrar — HDTO{% endblock %}
{% block content %}
  <h1>Entrar</h1>
  {% if form.errors %}
    <p class="error">E-mail ou senha inválidos.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Entrar</button>
  </form>
{% endblock %}
